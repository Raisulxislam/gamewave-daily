{{ define "title" }}{{ .Title }} — {{ .Site.Title }}{{ end }}
{{ define "otitle" }}{{ .Title }} — {{ .Site.Title }}{{ end }}
{{ define "main" }}
  <section class="wrap section">
    <div class="section-head page-head">
      <span class="section-label full">All Sections</span>
      <h2 class="section-title">Browse by topic</h2>
    </div>
    <div class="tag-cloud">
      {{ range .Data.Terms.ByCount }}
        <a class="chip" href="{{ .Page.RelPermalink }}">
          <span class="section-label {{ .Page.Title | lower }}">{{ .Page.Title }}</span>
          <em>{{ .Count }}</em>
        </a>
      {{ end }}
    </div>
  </section>
{{ end }}
