{{ define "title" }}{{ .Title }} — {{ .Site.Title }}{{ end }}
{{ define "otitle" }}{{ .Title }} — {{ .Site.Title }}{{ end }}
{{ define "main" }}
  <section class="wrap section">
    <div class="section-head page-head">
      <span class="section-label {{ .Title | lower }}">{{ .Title }}</span>
      <h2 class="section-title">{{ .Title }}</h2>
      <p class="page-count">{{ len .Pages }} articles</p>
    </div>
    <div class="grid">
      {{ range .Pages.ByDate.Reverse }}
        {{ partial "card.html" . }}
      {{ end }}
    </div>
  </section>
{{ end }}
